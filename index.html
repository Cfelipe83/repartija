<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albion Online - Loot Split Calculator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2pdf.js para generar el PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            albion: {
              dark: '#121418',
              card: '#1a1d24',
              gold: '#eab308',
              silver: '#cbd5e1',
              accent: '#d97706',
              border: '#2e3440'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-albion-dark text-gray-200 min-h-screen font-sans flex flex-col">

  <!-- Botón de Descarga PDF (No se verá en el PDF) -->
  <div class="max-w-5xl mx-auto w-full px-4 pt-4 flex justify-end">
    <button onclick="downloadPDF()" 
            class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-6 rounded-lg shadow-lg flex items-center gap-2 transition-transform transform hover:scale-105">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
      Descargar PDF para enviar
    </button>
  </div>

  <!-- Zona que será capturada en el PDF -->
  <div id="pdf-content" class="bg-albion-dark pb-8">
    
    <!-- Header -->
    <header class="border-b border-albion-border bg-albion-card/80 py-6 mb-8 mt-4">
      <div class="max-w-5xl mx-auto px-4 text-center">
        <h1 class="text-3xl md:text-4xl font-extrabold text-albion-gold tracking-wide uppercase">
          ⚔️ Albion Loot Split
        </h1>
        <p class="text-sm text-gray-400 mt-1">Reporte de reparto de plata y botín</p>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Columna Izquierda: Entradas y Subida de Imagen -->
      <div class="lg:col-span-7 space-y-6">
        
        <!-- Panel de Entradas -->
        <section class="bg-albion-card p-6 rounded-xl border border-albion-border shadow-lg" data-html2canvas-ignore="false">
          <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
            💰 Datos de la Party
          </h2>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-1">Valor Total del Botín</label>
              <input type="number" id="totalLoot" placeholder="Ej: 15000000" min="0" oninput="calculateSplit()"
                     class="w-full bg-albion-dark border border-albion-border rounded-lg px-3 py-2 text-white focus:outline-none focus:border-albion-gold">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-1">Costo de Reparaciones</label>
              <input type="number" id="repairCost" placeholder="Ej: 450000" min="0" oninput="calculateSplit()"
                     class="w-full bg-albion-dark border border-albion-border rounded-lg px-3 py-2 text-white focus:outline-none focus:border-albion-gold">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-1">Cantidad de Miembros</label>
              <input type="number" id="memberCount" value="5" min="1" oninput="calculateSplit()"
                     class="w-full bg-albion-dark border border-albion-border rounded-lg px-3 py-2 text-white focus:outline-none focus:border-albion-gold">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-1">Impuesto / Caller (%)</label>
              <input type="number" id="taxPercent" value="0" min="0" max="100" oninput="calculateSplit()"
                     class="w-full bg-albion-dark border border-albion-border rounded-lg px-3 py-2 text-white focus:outline-none focus:border-albion-gold">
            </div>
          </div>
        </section>

        <!-- Subida de Capturas -->
        <section class="bg-albion-card p-6 rounded-xl border border-albion-border shadow-lg">
          <h2 class="text-xl font-bold text-white mb-2 flex items-center gap-2">
            🖼️ Capturas de Respaldo
          </h2>
          
          <!-- Botón de subida (se ocultará al imprimir gracias a una clase dinámica) -->
          <label id="uploadBtn" class="border-2 border-dashed border-albion-border hover:border-albion-gold rounded-lg p-6 flex flex-col items-center justify-center cursor-pointer transition-colors bg-albion-dark/50">
            <span class="text-sm text-gray-300 text-center">Haz clic para añadir capturas de pantalla del cofre o reparación</span>
            <input type="file" id="imageInput" accept="image/*" multiple class="hidden" onchange="handleImageUpload(event)">
          </label>

          <!-- Galería de vistas previas -->
          <div id="imageGallery" class="grid grid-cols-2 gap-3 mt-4"></div>
        </section>
      </div>

      <!-- Columna Derecha: Resumen y Payout -->
      <div class="lg:col-span-5 space-y-6">
        
        <!-- Tarjeta de Resultados -->
        <section class="bg-albion-card p-6 rounded-xl border border-albion-gold/40 shadow-xl relative overflow-hidden">
          <div class="absolute top-0 right-0 bg-albion-gold text-black font-bold text-xs uppercase px-3 py-1 rounded-bl-lg">
            Resultado
          </div>

          <h2 class="text-xl font-bold text-white mb-6">Resumen Financiero</h2>

          <div class="space-y-3 text-sm">
            <div class="flex justify-between pb-2 border-b border-albion-border">
              <span class="text-gray-400">Total Bruto:</span>
              <span id="resTotal" class="font-semibold text-white">0 Silver</span>
            </div>
            <div class="flex justify-between pb-2 border-b border-albion-border">
              <span class="text-gray-400">Reparaciones:</span>
              <span id="resRepair" class="font-semibold text-red-400">- 0 Silver</span>
            </div>
            <div class="flex justify-between pb-2 border-b border-albion-border">
              <span class="text-gray-400">Impuesto / Caller:</span>
              <span id="resTax" class="font-semibold text-amber-400">- 0 Silver</span>
            </div>
            <div class="flex justify-between pb-2 border-b border-albion-border">
              <span class="text-gray-300 font-medium">Neto a Repartir:</span>
              <span id="resNet" class="font-bold text-green-400">0 Silver</span>
            </div>
          </div>

          <!-- Pago por Persona -->
          <div class="mt-6 bg-albion-dark p-4 rounded-lg border border-albion-border text-center">
            <span class="text-xs text-gray-400 uppercase tracking-wider block mb-1">Pago por Persona</span>
            <div id="resPerPerson" class="text-2xl sm:text-3xl font-extrabold text-albion-gold">
              0 Silver
            </div>
          </div>
        </section>

        <!-- Lista de Miembros / Check de Pago -->
        <section class="bg-albion-card p-6 rounded-xl border border-albion-border shadow-lg">
          <h3 class="text-lg font-bold text-white mb-3">Lista de Pagos</h3>
          <!-- Ajustamos la lista para que en el PDF se vea todo sin scroll -->
          <div id="payoutList" class="space-y-2 max-h-none">
          </div>
        </section>

      </div>
    </main>
  </div> <!-- Fin de la zona a capturar -->

  <script>
    // Formatear números a formato legible (ej: 1,500,000)
    function formatSilver(val) {
      return new Intl.NumberFormat('es-CL').format(Math.max(0, Math.round(val))) + ' Silver';
    }

    function calculateSplit() {
      const total = parseFloat(document.getElementById('totalLoot').value) || 0;
      const repair = parseFloat(document.getElementById('repairCost').value) || 0;
      const members = parseInt(document.getElementById('memberCount').value) || 1;
      const taxPercent = parseFloat(document.getElementById('taxPercent').value) || 0;

      const afterRepair = Math.max(0, total - repair);
      const taxAmount = (afterRepair * taxPercent) / 100;
      const netToSplit = Math.max(0, afterRepair - taxAmount);
      const perPerson = members > 0 ? netToSplit / members : 0;

      document.getElementById('resTotal').innerText = formatSilver(total);
      document.getElementById('resRepair').innerText = '- ' + formatSilver(repair);
      document.getElementById('resTax').innerText = '- ' + formatSilver(taxAmount) + ` (${taxPercent}%)`;
      document.getElementById('resNet').innerText = formatSilver(netToSplit);
      document.getElementById('resPerPerson').innerText = formatSilver(perPerson);

      const listContainer = document.getElementById('payoutList');
      listContainer.innerHTML = '';

      for (let i = 1; i <= members; i++) {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between bg-albion-dark p-2.5 rounded border border-albion-border text-sm';
        row.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-gray-300">Jugador ${i}</span>
          </div>
          <span class="font-bold text-albion-gold">${formatSilver(perPerson)}</span>
        `;
        listContainer.appendChild(row);
      }
    }

    // Manejador de subida de imágenes
    function handleImageUpload(event) {
      const files = event.target.files;
      const gallery = document.getElementById('imageGallery');

      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;

        const reader = new FileReader();
        reader.onload = function(e) {
          const card = document.createElement('div');
          // En vez de un aspect-ratio fijo, dejamos que la imagen tome su forma para que se vea bien en el PDF
          card.className = 'relative border border-albion-border rounded p-1 bg-black';
          card.innerHTML = `
            <img src="${e.target.result}" class="w-full h-auto rounded object-contain">
            <button onclick="this.parentElement.remove()" class="delete-btn absolute top-1 right-1 bg-red-600 hover:bg-red-700 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs transition">
              ✕
            </button>
          `;
          gallery.appendChild(card);
        };
        reader.readAsDataURL(file);
      }
    }

    // Función para generar y descargar el PDF
    function downloadPDF() {
      // 1. Ocultar elementos interactivos que no queremos en el PDF (botón de subir imagen y botones de borrar)
      document.getElementById('uploadBtn').style.display = 'none';
      document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = 'none');
      
      const element = document.getElementById('pdf-content');
      
      // 2. Configurar el PDF (Fondo oscuro, calidad alta)
      const opt = {
        margin:       [10, 10, 10, 10], // márgenes en mm
        filename:     'Reparto_Albion_Online.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { 
          scale: 2, 
          useCORS: true, 
          backgroundColor: '#121418' // Mantiene el color oscuro de Albion de fondo
        },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      // 3. Generar PDF y luego restaurar la vista
      html2pdf().set(opt).from(element).save().then(() => {
        // Restaurar los botones de interfaz
        document.getElementById('uploadBtn').style.display = 'flex';
        document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = 'flex');
      });
    }

    // Inicializar cálculo en carga
    calculateSplit();
  </script>
</body>
</html>
