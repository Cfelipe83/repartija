<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albion Online - Payouts Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            albion: {
              dark: '#121418',
              card: '#1a1d24',
              gold: '#eab308',
              silver: '#cbd5e1',
              accent: '#d97706',
              border: '#2e3440'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-albion-dark text-gray-200 min-h-screen font-sans flex flex-col">

  <div class="max-w-7xl mx-auto w-full px-4 pt-6 flex flex-wrap justify-end gap-3 no-pdf">
    <button onclick="copyToDiscord()" class="bg-[#5865F2] hover:bg-[#4752C4] text-white font-bold py-2 px-6 rounded-lg shadow-lg flex items-center gap-2 transition">
      Copiar para Discord
    </button>
    <button onclick="downloadPDF()" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-6 rounded-lg shadow-lg flex items-center gap-2 transition">
      Descargar PDF
    </button>
  </div>

  <div id="pdf-content" class="bg-albion-dark pb-8 mt-4">
    
    <header class="border-b border-albion-border bg-albion-card/80 py-6 mb-6">
      <div class="max-w-7xl mx-auto px-4 flex flex-col items-center">
        <input type="text" id="activityName" placeholder="Nombre de la actividad (Ej: Roaming ZN)" 
               class="text-2xl md:text-3xl font-extrabold text-albion-gold tracking-wide uppercase bg-transparent text-center border-b border-dashed border-gray-600 focus:outline-none focus:border-albion-gold w-full max-w-2xl placeholder-gray-500 mb-2">
        <div class="flex items-center gap-2 mt-2">
          <span class="text-sm text-gray-400">Fecha de la actividad:</span>
          <input type="date" id="activityDate" class="bg-albion-dark border border-gray-600 rounded px-2 py-1 text-sm text-gray-300 focus:outline-none focus:border-albion-gold">
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 grid grid-cols-1 xl:grid-cols-12 gap-8">
      
      <div class="xl:col-span-8 space-y-6">
        
        <section class="bg-albion-card p-6 rounded-xl border border-albion-border shadow-lg">
          <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">💰 Economía General</h2>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-1">Total del Botín (Silver)</label>
              <input type="number" id="totalLoot" placeholder="0" min="0" oninput="calculateSplit()"
                     class="w-full bg-albion-dark border border-albion-border rounded-lg px-3 py-2 text-white focus:outline-none focus:border-albion-gold">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-1">Reparaciones (Silver)</label>
              <input type="number" id="repairCost" placeholder="0" min="0" oninput="calculateSplit()"
                     class="w-full bg-albion-dark border border-albion-border rounded-lg px-3 py-2 text-white focus:outline-none focus:border-albion-gold">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-1">Impuesto Gremio (%)</label>
              <input type="number" id="taxPercent" value="0" min="0" max="100" oninput="calculateSplit()"
                     class="w-full bg-albion-dark border border-albion-border rounded-lg px-3 py-2 text-white focus:outline-none focus:border-albion-gold">
            </div>
          </div>
        </section>

        <section class="bg-albion-card p-6 rounded-xl border border-albion-border shadow-lg overflow-x-auto">
          <div class="flex justify-between items-center mb-4 min-w-[750px]">
            <h2 class="text-xl font-bold text-white flex items-center gap-2">🛡️ Lista de Participantes</h2>
            <button onclick="addPlayer()" class="no-pdf bg-albion-accent hover:bg-amber-600 text-white text-sm font-bold py-1.5 px-4 rounded transition">
              + Añadir Jugador
            </button>
          </div>
          
          <div class="hidden md:grid grid-cols-12 gap-2 mb-2 text-xs text-gray-400 uppercase font-bold px-2 min-w-[750px]">
            <div class="col-span-3">Nombre</div>
            <div class="col-span-1 text-center">Rol</div>
            <div class="col-span-1 text-center">% Asist.</div>
            <div class="col-span-2 text-right">Descuento</div>
            <div class="col-span-2 text-right text-green-400">Re-equipo</div>
            <div class="col-span-2 text-center text-blue-400">Killboard (Link)</div>
            <div class="col-span-1"></div>
          </div>

          <div id="playersContainer" class="space-y-3 min-w-[750px]">
            <!-- JS Inject -->
          </div>
        </section>

        <section class="bg-albion-card p-6 rounded-xl border border-albion-border shadow-lg">
          <h2 class="text-xl font-bold text-white mb-2 flex items-center gap-2">🖼️ Capturas de Respaldo</h2>
          <label id="uploadBtn" class="no-pdf border-2 border-dashed border-albion-border hover:border-albion-gold rounded-lg p-6 flex flex-col items-center justify-center cursor-pointer transition-colors bg-albion-dark/50 mb-4">
            <span class="text-sm text-gray-300 text-center">Haz clic para añadir capturas</span>
            <input type="file" accept="image/*" multiple class="hidden" onchange="handleImageUpload(event)">
          </label>
          <div id="imageGallery" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
        </section>

      </div>

      <div class="xl:col-span-4 space-y-6">
        <section class="bg-albion-card p-6 rounded-xl border border-albion-gold/40 shadow-xl relative overflow-hidden">
          <h2 class="text-xl font-bold text-white mb-6">Resumen Financiero</h2>
          <div class="space-y-3 text-sm">
            <div class="flex justify-between pb-2 border-b border-albion-border">
              <span class="text-gray-400">Total Bruto:</span>
              <span id="resTotal" class="font-semibold text-white">0</span>
            </div>
            <div class="flex justify-between pb-2 border-b border-albion-border">
              <span class="text-gray-400">Reparaciones:</span>
              <span id="resRepair" class="font-semibold text-red-400">- 0</span>
            </div>
            <div class="flex justify-between pb-2 border-b border-albion-border">
              <span class="text-gray-400">Impuesto:</span>
              <span id="resTax" class="font-semibold text-amber-400">- 0</span>
            </div>
            <div class="flex justify-between pb-2 border-b border-albion-border">
              <span class="text-gray-400">Total Re-equipos:</span>
              <span id="resRegear" class="font-semibold text-green-400">- 0</span>
            </div>
            <div class="flex justify-between pb-2 border-b border-albion-border">
              <span class="text-gray-300 font-medium">Neto a Repartir:</span>
              <span id="resNet" class="font-bold text-white text-lg">0</span>
            </div>
          </div>
        </section>

        <section class="bg-albion-card p-6 rounded-xl border border-albion-border shadow-lg">
          <h3 class="text-lg font-bold text-white mb-4 border-b border-albion-border pb-2">📋 Pagos Finales</h3>
          <div id="payoutList" class="space-y-2 text-sm max-h-none">
            <!-- JS Inject -->
          </div>
        </section>
      </div>
    </main>
  </div> 

  <script>
    document.getElementById('activityDate').value = new Date().toISOString().split('T')[0];

    let players = [
      { id: Date.now(), name: "Jugador 1", mult: 1, part: 100, buyout: 0, regear: 0, link: "" }
    ];

    function formatSilver(val) {
      return new Intl.NumberFormat('es-CL').format(Math.max(0, Math.round(val)));
    }
    function formatExact(val) {
      return new Intl.NumberFormat('es-CL').format(Math.round(val));
    }

    function renderPlayersInput() {
      const container = document.getElementById('playersContainer');
      container.innerHTML = '';

      players.forEach((p) => {
        const row = document.createElement('div');
        row.className = 'grid grid-cols-1 md:grid-cols-12 gap-2 items-center bg-albion-dark p-3 md:p-2 rounded border border-albion-border';
        
        row.innerHTML = `
          <div class="md:col-span-3">
            <input type="text" value="${p.name}" oninput="updatePlayer(${p.id}, 'name', this.value)" placeholder="Nick" class="w-full bg-transparent text-white focus:outline-none border-b border-gray-600 focus:border-albion-gold px-1 py-1">
          </div>
          <div class="md:col-span-1">
            <input type="number" value="${p.mult}" step="0.1" min="0" oninput="updatePlayer(${p.id}, 'mult', this.value)" class="w-full bg-transparent text-center text-white focus:outline-none border-b border-gray-600 focus:border-albion-gold px-1 py-1">
          </div>
          <div class="md:col-span-1">
            <input type="number" value="${p.part}" min="0" max="100" oninput="updatePlayer(${p.id}, 'part', this.value)" class="w-full bg-transparent text-center text-white focus:outline-none border-b border-gray-600 focus:border-albion-gold px-1 py-1">
          </div>
          <div class="md:col-span-2">
            <input type="number" value="${p.buyout || ''}" placeholder="0" oninput="updatePlayer(${p.id}, 'buyout', this.value)" class="w-full bg-transparent text-right text-red-400 focus:outline-none border-b border-gray-600 focus:border-albion-gold px-1 py-1">
          </div>
          <div class="md:col-span-2">
            <input type="number" value="${p.regear || ''}" placeholder="0" oninput="updatePlayer(${p.id}, 'regear', this.value)" class="w-full bg-transparent text-right text-green-400 focus:outline-none border-b border-gray-600 focus:border-albion-gold px-1 py-1">
          </div>
          <div class="md:col-span-2 flex items-center gap-1">
            <input type="url" value="${p.link || ''}" placeholder="URL" oninput="updatePlayer(${p.id}, 'link', this.value)" class="w-full bg-transparent text-xs text-blue-400 focus:outline-none border-b border-gray-600 focus:border-albion-gold px-1 py-1">
            <button onclick="autoFetchDeath(${p.id}, '${p.name}', event)" title="Buscar última muerte" class="no-pdf bg-gray-700 hover:bg-gray-600 text-white p-1 rounded text-xs transition">🔍</button>
          </div>
          <div class="md:col-span-1 flex justify-end md:justify-center">
            <button onclick="removePlayer(${p.id})" class="no-pdf text-red-500 hover:text-red-400 text-lg font-bold w-6 h-6 rounded hover:bg-red-900/30 transition">✕</button>
          </div>
        `;
        container.appendChild(row);
      });
      calculateSplit();
    }

    function addPlayer() {
      players.push({ id: Date.now(), name: `Jugador ${players.length + 1}`, mult: 1, part: 100, buyout: 0, regear: 0, link: "" });
      renderPlayersInput();
    }

    function removePlayer(id) {
      if(players.length > 1) {
        players = players.filter(p => p.id !== id);
        renderPlayersInput();
      }
    }

    function updatePlayer(id, field, value) {
      const p = players.find(p => p.id === id);
      if(p) {
        p[field] = (field === 'name' || field === 'link') ? value : (parseFloat(value) || 0);
        calculateSplit();
      }
    }

    // Buscador automático de muertes a través de la API oficial de Albion y proxy CORS
    async function autoFetchDeath(id, playerName, event) {
      if (!playerName || playerName.trim() === '' || playerName.startsWith('Jugador')) {
        alert("Escribe el Nick real del jugador para buscar.");
        return;
      }

      const btn = event.currentTarget;
      btn.innerText = "⏳";
      btn.disabled = true;

      try {
        // 1. Obtener ID del jugador
        const searchUrl = `https://gameinfo.albiononline.com/api/gameinfo/search?q=${playerName}`;
        const proxySearch = `https://api.allorigins.win/raw?url=${encodeURIComponent(searchUrl)}`;
        const searchRes = await fetch(proxySearch);
        const searchData = await searchRes.json();

        if (!searchData.players || searchData.players.length === 0) {
          alert(`No se encontró el jugador "${playerName}".`);
          btn.innerText = "🔍";
          btn.disabled = false;
          return;
        }

        const exactMatch = searchData.players.find(p => p.Name.toLowerCase() === playerName.toLowerCase()) || searchData.players[0];
        
        // 2. Obtener muertes
        const deathsUrl = `https://gameinfo.albiononline.com/api/gameinfo/players/${exactMatch.Id}/deaths`;
        const proxyDeaths = `https://api.allorigins.win/raw?url=${encodeURIComponent(deathsUrl)}`;
        const deathsRes = await fetch(proxyDeaths);
        const deathsData = await deathsRes.json();

        if (!deathsData || deathsData.length === 0) {
          alert(`No hay muertes recientes para ${exactMatch.Name}.`);
          btn.innerText = "🔍";
          btn.disabled = false;
          return;
        }

        // 3. Obtener el link del Killboard oficial
        const killUrl = `https://albiononline.com/killboard/kill/${deathsData[0].EventId}`;
        updatePlayer(id, 'link', killUrl);
        renderPlayersInput(); 

      } catch (error) {
        console.error(error);
        alert("Hubo un error de conexión con Albion API.");
        btn.innerText = "🔍";
        btn.disabled = false;
      }
    }

    let finalPayouts = []; 
    let globalNet = 0;

    function calculateSplit() {
      const total = parseFloat(document.getElementById('totalLoot').value) || 0;
      const repair = parseFloat(document.getElementById('repairCost').value) || 0;
      const taxPercent = parseFloat(document.getElementById('taxPercent').value) || 0;
      
      const afterRepair = Math.max(0, total - repair);
      const taxAmount = (afterRepair * taxPercent) / 100;
      const totalRegears = players.reduce((sum, p) => sum + p.regear, 0);
      
      globalNet = Math.max(0, afterRepair - taxAmount - totalRegears);

      let totalWeight = 0;
      players.forEach(p => { totalWeight += p.mult * (p.part / 100); });
      const valuePerWeight = totalWeight > 0 ? (globalNet / totalWeight) : 0;

      document.getElementById('resTotal').innerText = formatSilver(total);
      document.getElementById('resRepair').innerText = '- ' + formatSilver(repair);
      document.getElementById('resTax').innerText = '- ' + formatSilver(taxAmount);
      document.getElementById('resRegear').innerText = '- ' + formatSilver(totalRegears);
      document.getElementById('resNet').innerText = formatSilver(globalNet);

      const listContainer = document.getElementById('payoutList');
      listContainer.innerHTML = '';
      finalPayouts = [];

      players.forEach(p => {
        const splitShare = (p.mult * (p.part / 100)) * valuePerWeight;
        const netPayout = splitShare - p.buyout + p.regear;

        finalPayouts.push({ name: p.name, net: netPayout, buyout: p.buyout, regear: p.regear, link: p.link });

        const isOwed = netPayout < 0; 
        const textClass = isOwed ? 'text-red-400 font-bold' : 'text-albion-gold font-bold';
        const formattedAmount = isOwed ? `DEBE ${formatExact(Math.abs(netPayout))}` : formatExact(netPayout);

        const row = document.createElement('div');
        row.className = 'flex justify-between items-center py-2 border-b border-albion-border/50 last:border-0';
        
        let detailsHtml = '';
        if (p.buyout > 0) detailsHtml += `<span class="text-[10px] text-gray-500 block">Items: -${formatExact(p.buyout)}</span>`;
        if (p.regear > 0) detailsHtml += `<span class="text-[10px] text-green-500 block">Re-equipo: +${formatExact(p.regear)}</span>`;

        row.innerHTML = `
          <div class="flex flex-col">
            <span class="text-gray-200 truncate pr-2">${p.name}</span>
            ${p.link ? `<a href="${p.link}" target="_blank" class="text-[10px] text-blue-400 underline truncate max-w-[150px]">Resp. Muerte 🔗</a>` : ''}
          </div>
          <div class="text-right flex flex-col items-end">
            <span class="${textClass}">${formattedAmount}</span>
            ${detailsHtml}
          </div>
        `;
        listContainer.appendChild(row);
      });
    }

    function copyToDiscord() {
      const actName = document.getElementById('activityName').value || 'Actividad';
      const actDate = document.getElementById('activityDate').value;
      const total = parseFloat(document.getElementById('totalLoot').value) || 0;
      const repair = parseFloat(document.getElementById('repairCost').value) || 0;
      const taxPercent = parseFloat(document.getElementById('taxPercent').value) || 0;
      const totalRegears = players.reduce((sum, p) => sum + p.regear, 0);
      
      let text = `⚔️ **REPARTO DE LOOT: ${actName}** 📅 ${actDate}
`;
      text += `💰 **Total:** ${formatSilver(total)} | 🛠️ **Rep:** -${formatSilver(repair)} | 👑 **Tax:** -${formatSilver(Math.max(0, total - repair)*taxPercent/100)} | ⚰️ **Reequipos:** -${formatSilver(totalRegears)}
`;
      text += `✅ **Neto Repartido:** ${formatSilver(globalNet)}

`;
      text += `**PAGOS:**
`;
      
      finalPayouts.forEach(p => {
        let details = [];
        if(p.buyout > 0) details.push(`Items: -${formatExact(p.buyout)}`);
        if(p.regear > 0) details.push(`Reequipo: +${formatExact(p.regear)}`);
        
        let detailString = details.length > 0 ? ` *(${details.join(', ')})*` : '';
        let linkString = p.link ? ` - [Muerte](${p.link})` : '';
        
        if(p.net >= 0) {
          text += `**@${p.name}** : ${formatExact(p.net)}${detailString}${linkString}
`;
        } else {
          text += `**@${p.name}** : DEBE ${formatExact(Math.abs(p.net))}${detailString}${linkString}
`;
        }
      });

      navigator.clipboard.writeText(text).then(() => {
        alert('¡Resumen copiado! Listo para pegar en Discord.');
      });
    }

    function handleImageUpload(event) {
      const files = event.target.files;
      const gallery = document.getElementById('imageGallery');
      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;
        const reader = new FileReader();
        reader.onload = function(e) {
          const card = document.createElement('div');
          card.className = 'relative border border-albion-border rounded p-1 bg-black';
          card.innerHTML = `
            <img src="${e.target.result}" class="w-full h-auto rounded object-contain">
            <button onclick="this.parentElement.remove()" class="no-pdf absolute top-1 right-1 bg-red-600 hover:bg-red-700 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs transition">✕</button>
          `;
          gallery.appendChild(card);
        };
        reader.readAsDataURL(file);
      }
    }

    function downloadPDF() {
      const actName = document.getElementById('activityName').value || 'Reparto';
      const actDate = document.getElementById('activityDate').value;
      const hideElements = document.querySelectorAll('.no-pdf');
      hideElements.forEach(el => el.style.display = 'none');
      const element = document.getElementById('pdf-content');
      
      const opt = {
        margin:       [10, 10, 10, 10],
        filename:     `Payout_${actDate}_${actName.replace(/\s+/g, '_')}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#121418' },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        hideElements.forEach(el => el.style.display = '');
      });
    }

    renderPlayersInput();
  </script>
</body>
</html>
